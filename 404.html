<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Stetwood Group</title>
  <meta name="description" content="This page could not be found.">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f2219" media="(prefers-color-scheme: dark)">
  <script>
    /* Runs before first paint: apply a saved theme choice so there's no flash. */
    (function(){
      var d=document.documentElement, t=null;
      d.classList.add('js');
      try{ t=localStorage.getItem('stetwood-theme'); }catch(e){}
      if(t!=='light' && t!=='dark') t=null;
      if(t) d.setAttribute('data-theme',t);
      var dark = t ? t==='dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      d.classList.add(dark?'theme-dark':'theme-light');
    })();
  </script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/fonts/cormorant-garamond-latin-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="/" aria-label="Stetwood Group home">
        <!-- Follows the OS setting (works without JS) -->
        <picture class="theme-auto">
          <source srcset="/brand/lockup-header-dark.svg" media="(prefers-color-scheme: dark)">
          <img src="/brand/lockup-header-light.svg" alt="Stetwood Group" width="296" height="52">
        </picture>
        <!-- Shown instead when the visitor picked a theme with the toggle -->
        <img class="theme-only-light" src="/brand/lockup-header-light.svg" alt="Stetwood Group" width="296" height="52">
        <img class="theme-only-dark" src="/brand/lockup-header-dark.svg" alt="Stetwood Group" width="296" height="52">
      </a>
      <div class="header-right">
        <button type="button" class="theme-toggle" aria-label="Switch theme" title="Switch theme">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M21 14.6A9 9 0 0 1 9.4 3a.6.6 0 0 0-.8-.7A10 10 0 1 0 21.7 15.4a.6.6 0 0 0-.7-.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></g></svg>
        </button>
      </div>
    </div>
  </header>
  <main id="main" class="notfound">
    <div class="wrap">
      <h1>Page not found</h1>
      <p>Sorry, that page doesn't exist. It may have moved, or the link may be mistyped.</p>
      <p><a class="btn btn-primary" href="/">Back to the home page</a></p>
    </div>
  </main>
  <footer class="site-footer">
    <div class="wrap"><p class="foot-brand"><picture class="theme-auto"><source srcset="/brand/icon-dark-transparent.svg" media="(prefers-color-scheme: dark)"><img src="/brand/icon-light.svg" alt="" width="36" height="36"></picture><img class="theme-only-light" src="/brand/icon-light.svg" alt="" width="36" height="36"><img class="theme-only-dark" src="/brand/icon-dark-transparent.svg" alt="" width="36" height="36"><span>&copy; 2026 Stetwood Group</span></p></div>
  </footer>
  <script src="/theme.js"></script>
</body>
</html>
